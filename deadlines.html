<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Deadlines · CampusPulse AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%238C1D2B'/><path d='M4 17h7l3-8 4 14 3-6h7' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="app-page is-loading">

<div class="loading-screen" aria-live="polite">
  <svg class="pulse pulse-small" viewBox="0 0 300 100" aria-hidden="true">
    <path class="pulse-line" pathLength="1"
      d="M0 65 H110 L122 65 L134 30 L150 92 L166 10 L180 75 L190 65 H300" />
  </svg>
  <p>Loading your deadlines…</p>
</div>

<header class="topbar">
  <p class="wordmark">CampusPulse AI</p>
  <nav class="mainnav" aria-label="Main">
    <a href="app.html">Home</a>
    <a href="deadlines.html" aria-current="page">Deadlines</a>
  </nav>
  <div class="user-chip">
    <span class="avatar" id="userAvatar" aria-hidden="true"></span>
    <span class="user-name" id="userName"></span>
    <button type="button" class="btn-quiet" id="signOutBtn">Sign out</button>
  </div>
</header>

<main class="home deadlines">
  <div class="page-head">
    <h1 class="page-title">Deadlines</h1>
    <button type="button" class="btn-primary" id="addBtn">Add deadline</button>
  </div>

  <p class="notice" id="loadError" role="alert" hidden></p>

  <div class="toolbar">
    <div class="tabs" role="group" aria-label="Show">
      <button type="button" class="tab" data-view="upcoming">Upcoming <span class="tab-count">0</span></button>
      <button type="button" class="tab" data-view="overdue">Overdue <span class="tab-count">0</span></button>
      <button type="button" class="tab" data-view="done">Done <span class="tab-count">0</span></button>
      <button type="button" class="tab" data-view="all">All <span class="tab-count">0</span></button>
    </div>
    <div class="filters">
      <label class="visually-hidden" for="categoryFilter">Category</label>
      <select id="categoryFilter">
        <option value="">All categories</option>
      </select>
      <label class="visually-hidden" for="searchInput">Search deadlines</label>
      <input type="search" id="searchInput" placeholder="Search title, course or notes" />
    </div>
  </div>

  <div class="nudge" id="overdueNudge" hidden>
    <span id="overdueNudgeText"></span>
    <button type="button" class="btn-quiet" id="showOverdueBtn">Show overdue</button>
  </div>

  <div id="deadlineGroups" class="timeline"></div>

  <div class="empty-state" id="emptyState" hidden>
    <p id="emptyStateText"></p>
    <button type="button" class="btn-primary" id="emptyAddBtn">Add deadline</button>
  </div>
</main>

<dialog class="dl-dialog" id="deadlineDialog" aria-labelledby="dialogTitle">
  <form id="deadlineForm" novalidate>
    <h2 id="dialogTitle">Add deadline</h2>

    <label for="dlTitle">Title</label>
    <input id="dlTitle" name="dlTitle" type="text" maxlength="200" required
           placeholder="Market analysis report" />

    <div class="form-row">
      <div>
        <label for="dlCategory">Category</label>
        <select id="dlCategory" name="category"></select>
      </div>
      <div>
        <label for="dlCourse">Course <span class="optional">(optional)</span></label>
        <input id="dlCourse" name="course" type="text" maxlength="100" placeholder="Marketing Management" />
      </div>
    </div>

    <div class="form-row">
      <div>
        <label for="dlDate">Due date</label>
        <input id="dlDate" name="dueDate" type="date" required />
      </div>
      <div>
        <label for="dlTime">Due time</label>
        <input id="dlTime" name="dueTime" type="time" />
      </div>
    </div>

    <label for="dlLink">Link <span class="optional">(optional)</span></label>
    <input id="dlLink" name="link" type="url" placeholder="https://lms.iiml.ac.in/…" />

    <label for="dlNotes">Notes <span class="optional">(optional)</span></label>
    <textarea id="dlNotes" name="notes" rows="3" maxlength="2000"
              placeholder="Group of 4, submit on LMS as PDF"></textarea>

    <p class="form-error" id="formError" role="alert" hidden></p>

    <div class="dialog-actions">
      <button type="button" class="btn-danger" id="deleteBtn" hidden>Delete</button>
      <span class="spacer"></span>
      <button type="button" class="btn-quiet" id="cancelBtn">Cancel</button>
      <button type="submit" class="btn-primary" id="saveBtn">Add deadline</button>
    </div>
  </form>
</dialog>

<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>

<script type="module" src="js/deadlines-page.js"></script>
</body>
</html>
