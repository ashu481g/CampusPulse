<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · CampusPulse AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%238C1D2B'/><path d='M4 17h7l3-8 4 14 3-6h7' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="signin-page">

<main class="signin">
  <section class="brand-panel" aria-label="About CampusPulse AI">
    <p class="wordmark">CampusPulse AI</p>

    <svg class="pulse" viewBox="0 0 1000 200" aria-hidden="true">
      <path class="pulse-line" pathLength="1"
        d="M0 130 H400 L425 130 L450 62 L480 188 L512 22 L540 150 L558 130 H1000" />
    </svg>

    <p class="brand-line">Deadlines, attendance and placement updates from your IIM Lucknow inbox, on one screen.</p>
  </section>

  <section class="signin-panel">
    <div class="signin-box">
      <h1>Sign in</h1>
      <p class="signin-lead">Use your institute Google account, <strong id="domainNote">@iiml.ac.in</strong>.</p>

      <button type="button" class="google-btn" id="googleBtn">
        <svg class="google-g" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        <span class="google-btn-label">Continue with Google</span>
      </button>

      <p class="signin-message" id="signinMessage" role="status" aria-live="polite" hidden></p>

      <p class="signin-fine">For now CampusPulse reads only your name, email address and profile photo. Nothing from your inbox is accessed at this stage.</p>
    </div>
  </section>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
