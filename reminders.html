<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Reminders · CampusPulse AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%238C1D2B'/><path d='M4 17h7l3-8 4 14 3-6h7' fill='none' stroke='white' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="app-page is-loading">

<div class="loading-screen" aria-live="polite">
  <svg class="pulse pulse-small" viewBox="0 0 300 100" aria-hidden="true">
    <path class="pulse-line" pathLength="1"
      d="M0 65 H110 L122 65 L134 30 L150 92 L166 10 L180 75 L190 65 H300" />
  </svg>
  <p>Loading your reminder settings…</p>
</div>

<header class="topbar">
  <p class="wordmark">CampusPulse AI</p>
  <nav class="mainnav" aria-label="Main">
    <a href="app.html">Home</a>
    <a href="deadlines.html">Deadlines</a>
    <a href="attendance.html">Attendance</a>
    <a href="reminders.html" aria-current="page">Reminders</a>
  </nav>
  <div class="user-chip">
    <span class="avatar" id="userAvatar" aria-hidden="true"></span>
    <span class="user-name" id="userName"></span>
    <button type="button" class="btn-quiet" id="signOutBtn">Sign out</button>
  </div>
</header>

<main class="home reminders">
  <div class="page-head">
    <h1 class="page-title">Reminders</h1>
  </div>
  <p class="home-lead">One email a day with overdue work, what's due today and soon, and any subject where attendance needs care.</p>

  <p class="notice" id="loadError" role="alert" hidden></p>

  <form class="panel" id="reminderForm" novalidate>
    <label class="switch-row">
      <input type="checkbox" id="enabled" class="switch-input" />
      <span class="switch" aria-hidden="true"></span>
      <span>
        <span class="switch-label">Email me a daily summary</span>
        <span class="switch-help" id="summaryLine">Daily reminders are off.</span>
      </span>
    </label>

    <div class="reminder-options" id="reminderOptions" data-off="true">
      <div class="form-row">
        <div>
          <label for="sendHour">Send at (India time)</label>
          <select id="sendHour"></select>
        </div>
        <div>
          <label for="daysAhead">Include deadlines due</label>
          <select id="daysAhead"></select>
        </div>
      </div>

      <label class="check-row">
        <input type="checkbox" id="includeAttendance" />
        Include subjects where attendance is below target or has no room to miss a class
      </label>
      <label class="check-row">
        <input type="checkbox" id="skipEmpty" />
        Skip the email on days with nothing to report
      </label>

      <p class="recipient-line">Sent to <strong id="recipient"></strong></p>
    </div>

    <div class="form-actions">
      <button type="submit" class="btn-primary" id="saveBtn">Save settings</button>
      <span class="save-note" id="saveNote" aria-live="polite"></span>
    </div>
  </form>

  <section class="panel test-panel" aria-labelledby="testHeading">
    <h2 id="testHeading">Try it now</h2>
    <p class="upcoming-summary">Send today's summary to yourself straight away, whatever your settings.</p>
    <button type="button" class="btn-quiet" id="testBtn">Send me a test email</button>
    <p class="test-result" id="testResult" role="status" hidden></p>
    <p class="last-status" id="lastStatus"></p>
  </section>
</main>

<script type="module" src="js/reminders-page.js"></script>
</body>
</html>
